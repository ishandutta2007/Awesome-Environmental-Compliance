<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .pulse-line {
        stroke-dasharray: 200;
        stroke-dashoffset: 400;
        animation: dash 6s linear infinite;
      }
      .float-node {
        animation: float 4s ease-in-out infinite alternate;
      }
      .float-node-delayed {
        animation: float 4s ease-in-out 2s infinite alternate;
      }
      .rotate-ring {
        transform-origin: 1050px 175px;
        animation: rotate 20s linear infinite;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Background Grid / Geometric Patterns -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Dynamic Animated Tech Waves / Lines (Kept in Background) -->
  <path d="M -50 280 Q 300 180 600 270 T 1250 190" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.4" class="pulse-line"/>
  <path d="M -50 310 Q 350 210 650 300 T 1250 220" fill="none" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.3" class="pulse-line"/>

  <!-- Rotating Tech Ring on Right -->
  <g class="rotate-ring" opacity="0.25">
    <circle cx="1050" cy="175" r="110" fill="none" stroke="url(#textGrad)" stroke-width="2" stroke-dasharray="15 10 5 10"/>
    <circle cx="1050" cy="175" r="85" fill="none" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="40 20"/>
  </g>

  <!-- Floating Floating Cards / Pills (Background Layer) -->
  <g class="float-node" opacity="0.35">
    <rect x="850" y="50" width="140" height="36" rx="18" fill="#11998e"/>
    <text x="920" y="73" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">EHS DATA</text>
  </g>
  <g class="float-node-delayed" opacity="0.35">
    <rect x="980" y="240" width="160" height="36" rx="18" fill="#4FACFE"/>
    <text x="1060" y="263" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">COMPLIANCE AI</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Crystal Clear & Prominent) -->
  <g transform="translate(80, 0)">
    <!-- Leaf / Eco Icon -->
    <g transform="translate(0, 82)">
      <path d="M25 0 C10 0 0 10 0 25 C0 42 25 55 25 55 C25 55 50 42 50 25 C50 10 40 0 25 0 Z" fill="url(#accentGrad)" filter="url(#glow)"/>
      <path d="M25 10 L25 45 M25 25 L35 15 M25 32 L15 22" stroke="#0f2027" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Main Title -->
    <text x="70" y="125" fill="url(#textGrad)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1">
      Awesome Environmental Compliance
    </text>

    <!-- Subtitle -->
    <text x="70" y="170" fill="#E0E6ED" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Curated Ecosystem of EHS Platforms, Regulatory Tracking &amp; Open-Source Tools
    </text>

    <!-- Highlight Badges/Pills in Header -->
    <g transform="translate(70, 205)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="32" rx="6" fill="#1e3a4a" stroke="#38ef7d" stroke-width="1.5"/>
      <text x="72.5" y="21" fill="#38ef7d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🍃 EHS &amp; Safety</text>

      <!-- Pill 2 -->
      <rect x="160" y="0" width="175" height="32" rx="6" fill="#1e3a4a" stroke="#00F2FE" stroke-width="1.5"/>
      <text x="247.5" y="21" fill="#00F2FE" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📊 Regulatory Audits</text>

      <!-- Pill 3 -->
      <rect x="350" y="0" width="170" height="32" rx="6" fill="#1e3a4a" stroke="#4FACFE" stroke-width="1.5"/>
      <text x="435" y="21" fill="#4FACFE" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡ Open Source AI</text>
    </g>

    <!-- Bottom Motto -->
    <text x="70" y="280" fill="#94A3B8" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-style="italic">
      Empowering EHS Officers, Environmental Managers, and Developers with Transparent Compliance Solutions.
    </text>
  </g>
</svg>
